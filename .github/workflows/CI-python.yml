name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron:  '30 5 * * *'

jobs:
  ci-python:
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        pythonVersion: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.pythonVersion }}
    - if: ${{ matrix.pythonVersion == '3.10' }}
      name: Install PyTorch from Conda on Python 3.10
      run: |
        conda install --yes --quiet pytorch torchvision cpuonly "mkl<2024.1" -c pytorch
    - if: ${{ matrix.pythonVersion != '3.10' }}
      name: Install PyTorch from pip
      run: |
        pip install torch torchvision
    - name: Install package and test dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade \
          numpy pandas scipy scikit-learn shap \
          -e ./python \
          -r requirements-dev.txt \
          -r requirements-test.txt \
          -r requirements-vis.txt
    - name: Verify dependency consistency
      run: |
        pip check
    - name: Run all tests
      run: |
        python tests/run_tests.py --coverage
    - if: ${{ matrix.pythonVersion == '3.10' }}
      name: Test dashboard with legacy integration dependencies
      run: |
        python -m venv "$RUNNER_TEMP/dashboard-env"
        dashboard_python="$RUNNER_TEMP/dashboard-env/bin/python"
        "$dashboard_python" -m pip install --upgrade pip
        "$dashboard_python" -m pip install \
          -e ./python raiwidgets "scikit-learn==1.4.2" \
          lightgbm "xgboost<2.1.0" matplotlib pytest-cov \
          -r requirements-vis.txt
        "$dashboard_python" -m pip check
        "$dashboard_python" tests/run_tests.py \
          --coverage --append-coverage \
          --framework none tests/test_explanation_dashboard.py

    - if: ${{ matrix.pythonVersion == '3.10' }}
      name: Upload code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: interpret_community-code-coverage-results
        path: htmlcov

    - if: ${{ matrix.pythonVersion == '3.10' }}
      name: Upload to codecov
      id: codecovupload1
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        path_to_write_report: ./coverage/codecov_report.txt
        verbose: true

    - if: ${{ (steps.codecovupload1.outcome == 'failure') && (matrix.pythonVersion == '3.10') }}
      name: Retry upload to codecov
      id: codecovupload2
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        path_to_write_report: ./coverage/codecov_report.txt
        verbose: true

    - if: ${{ matrix.pythonVersion == '3.10' }}
      name: Set codecov status
      run: |
        if ${{ (steps.codecovupload1.outcome == 'success') || (steps.codecovupload2.outcome == 'success') }} ; then
          echo fine
        else
          exit 1
        fi

  ci-numpy-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - numpyVersion: '1.26.4'
            dependencySet: latest
          - numpyVersion: '2.0.2'
            dependencySet: latest
          - numpyVersion: '2.0.2'
            dependencySet: minimum
          - numpyVersion: '2.2.6'
            dependencySet: latest

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ${{ matrix.dependencySet }} dependencies with NumPy ${{ matrix.numpyVersion }}
      run: |
        python -m pip install --upgrade pip
        constraint_file="${{ github.workspace }}/numpy-constraints.txt"
        echo "numpy==${{ matrix.numpyVersion }}" > "$constraint_file"
        if [[ "${{ matrix.dependencySet }}" == "minimum" ]]; then
          cat numpy_compatibility_tests/requirements-minimum.txt >> "$constraint_file"
        fi
        PIP_CONSTRAINT="$constraint_file" pip install \
          "numpy==${{ matrix.numpyVersion }}" -e ./python pytest \
          "lime>=0.2.0.0"

    - name: Verify dependency consistency
      run: |
        python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpyVersion }}'"
        pip check

    - name: Run NumPy compatibility tests
      run: |
        python tests/run_tests.py --compatibility-only
