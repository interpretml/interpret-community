name: CI Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron:  '30 5 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  ci-dashboard:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dashboard integration dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          -e ./python raiwidgets "scikit-learn==1.4.2" \
          lightgbm "xgboost<2.1.0" matplotlib pytest-cov \
          -r requirements-vis.txt

    - name: Verify dependency consistency
      run: |
        python -m pip check

    - name: Test dashboard integration
      run: |
        python tests/run_tests.py --coverage \
          --framework none tests/test_explanation_dashboard.py

    - name: Upload dashboard coverage results
      uses: actions/upload-artifact@v4
      with:
        name: interpret_community-dashboard-code-coverage-results
        path: |
          htmlcov
          coverage.xml

    - name: Upload dashboard coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: dashboard
        name: codecov-dashboard
        fail_ci_if_error: false
        use_oidc: true
